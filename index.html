    function softToast(msg) {
      state.toastMessage = msg;
      const root = document.getElementById("toast-root");
      if (root) {
        root.innerHTML = `<div class="fixed bottom-5 right-5 z-[90] max-w-sm bg-gray-600 text-white px-4 py-3 rounded-lg shadow-xl border border-gray-700 text-sm font-medium">${escapeHtml(msg)}</div>`;

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- KOMPRESI GAMBAR OTOMATIS ---
    function compressImageFile(file, maxWidth = 800, quality = 0.75) {
      return new Promise((resolve, reject) => {
        if (file.type === "image/svg+xml") {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const outputType = file.type === "image/png" ? "image/png" : "image/jpeg";
            resolve(canvas.toDataURL(outputType, quality));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // --- SYNC CLOUD SUPABASE ---
    // Semua tabel memakai pola: id (text, PK) + data (jsonb) + created_at (bigint)
    function reportCloudError(err) {
      console.error("[CLOUD SAVE ERROR]", err);
      const msg = err?.message || "lihat console (F12)";
      setTimeout(() => showToast("GAGAL menyimpan ke Cloud: " + msg), 350);
    }

    async function persistSiteConfig() {
      saveBackups();
      if (isAdmin()) await syncSettingsToCloud({ siteConfig: state.siteConfig }).catch(() => {});
    }

    function canWriteCloud() {
      return !!sb && !!state.authUser;
    }

    async function cloudUpsert(table, id, obj) {
      if (!canWriteCloud()) return;
      const { id: _omit, ...rest } = obj;
      const { error } = await sb.from(table).upsert({
        id,
        data: rest,
        created_at: obj.createdAt || Date.now()
      });
      if (error) { reportCloudError(error); throw error; }
    }

    async function cloudDelete(table, id) {
      if (!canWriteCloud()) return;
      const { error } = await sb.from(table).delete().eq("id", id);
      if (error) { reportCloudError(error); throw error; }
    }

    async function syncSettingsToCloud(payload) {
      if (!canWriteCloud()) return;
      // Gabungkan dengan data yang sudah ada (setara merge:true di Firestore)
      const { data: row } = await sb.from(T.settings).select("data").eq("id", "main").maybeSingle();
      const merged = { ...(row?.data || {}), ...payload, updatedAt: Date.now() };
      const { error } = await sb.from(T.settings).upsert({ id: "main", data: merged });
      if (error) { reportCloudError(error); throw error; }
    }

      if (!sb) return;
      await sb.rpc("increment_publication_views", { pub_id: pubId }).then(() => {}, () => {});

    async function forceSyncAllToCloud() {
      if (!isAdmin()) return;
      saveBackups();
      if (!canWriteCloud()) {
        showToast("Tersimpan di penyimpanan browser.");
        return;
      }
      try {
        await syncSettingsToCloud({
          siteConfig: state.siteConfig,
          boardMembers: state.boardMembers,
          categoryMeta: state.categoryMeta
        });
        for (const pub of state.publications) await cloudUpsert(T.publications, pub.id, pub);
        for (const ev of state.events) await cloudUpsert(T.events, ev.id, ev);
        for (const adv of state.advocacyCases) await cloudUpsert(T.advocacy, adv.id, adv);
        showToast("Seluruh perubahan, tulisan & logo berhasil disinkronkan ke Cloud!");
      } catch (err) {
        console.error(err);
        showToast("Tersimpan di cadangan browser.");
      }
    }

    // Ubah baris Supabase -> objek aplikasi
    const rowToItem = (r) => ({ id: r.id, ...(r.data || {}), createdAt: r.created_at || r.data?.createdAt || 0 });

    // --- MUAT PROFIL USER (admin / member) ---
    async function resolveCurrentUser(user) {
      if (!user) return null;
      const metaName = user.user_metadata?.name || user.user_metadata?.full_name;
      const base = { id: user.id, email: user.email };
      try {
        const { data: adm, error: admErr } = await sb.from(T.admins).select("id,name").eq("id", user.id).maybeSingle();
        if (admErr) {
          console.error("[ADMIN CHECK] Gagal membaca tabel admins:", admErr);
          showToast("Cek admin gagal: " + (admErr.message || "lihat console (F12)"));
        } else if (adm) {
          console.info("[ADMIN CHECK] Login sebagai ADMIN:", user.email);
          return { ...base, name: adm.name || metaName || user.email, role: "admin" };
        } else {
          console.warn("[ADMIN CHECK] Akun ini TIDAK ada di tabel admins. UID:", user.id, "Email:", user.email);
        }
        const { data: mem } = await sb.from(T.users).select("name").eq("id", user.id).maybeSingle();
        return { ...base, name: mem?.name || metaName || user.email, role: "member" };
      } catch (err) {
        console.error("[ADMIN CHECK] Error:", err);
        return { ...base, name: metaName || user.email, role: "member" };
      }
    }

    // --- PENGAJUAN TULISAN DARI MEMBER ---
    const MAX_PENDING_PER_USER = 5;

    function safeHttpUrl(u) {
      const v = String(u || "").trim();
      if (!v) return "";
      try {
        const x = new URL(v);
        return x.protocol === "http:" || x.protocol === "https:" ? x.href : "";
      } catch {
        return "";
      }
    }

    function buildSubmissionData(sub, overrides = {}) {
      return {
        type: sub.type,
        category: sub.category,
        title: sub.title,
        author: sub.author,
        excerpt: sub.excerpt || "",
        content: sub.content,
        docUrl: sub.docUrl || "",

    // Simpan hasil suntingan admin (judul, ringkasan, isi). Penulis & bidang tidak diubah.
    async function saveSubmissionEdits(id, vals) {
      const sub = state.submissions.find((x) => x.id === id);
      if (!sub || !isAdmin()) return false;
      const title = String(vals.title || "").trim();
      const excerpt = String(vals.excerpt || "").trim();
      const content = String(vals.content || "").trim();
      if (!title || content.length < 50) {
        softToast("Judul wajib diisi dan isi tulisan minimal 50 karakter.");
        return false;
      }
      const { error } = await sb
        .from(T.submissions)
        .update({ data: buildSubmissionData(sub, { title, excerpt, content }) })
        .eq("id", id);
      if (error) {
        console.error("Simpan suntingan gagal:", error);
        softToast("Gagal menyimpan suntingan: " + (error.message || "lihat console"));
        return false;
      }
      state.editingSubmissionId = null;
      state.reviewDraft = {};
      await loadSubmissions();
      return true;
    }

    // Terbitkan pengajuan menjadi publikasi resmi
    async function publishSubmission(sub) {
      if (!sub || !isAdmin()) return false;
      const category = state.categoryMeta[sub.category] ? sub.category : "sosial";
      const link = safeHttpUrl(sub.docUrl);
      const newPub = {
        id: `pub-${Date.now()}`,
        type: sub.type === "report" ? "report" : "opinion",
        category,
        title: sub.title,
        author: sub.author,
        date: new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" }),
        excerpt: (sub.excerpt || "").trim() || String(sub.content || "").slice(0, 150) + "...",
        content: sub.content,
        docUrl: link,
        docName: link.includes("mega.nz") ? "Dokumen_MEGA.pdf" : "Dokumen_Lampiran.pdf",
        coverGradient: (COVER_PRESETS.find((c) => c.id === category) || COVER_PRESETS[0]).gradient,
        customCover: "",
        views: 0,
        createdAt: Date.now()
      };
      try {
        await cloudUpsert(T.publications, newPub.id, newPub);
        const { error } = await sb.from(T.submissions).update({ status: "approved" }).eq("id", sub.id);
        if (error) throw error;
        state.publications.unshift(newPub);
        saveBackups();
        state.editingSubmissionId = null;
        state.reviewDraft = {};
        await loadSubmissions();
        showToast("Tulisan disetujui dan sudah tayang di Fokus Kajian.");
        return true;
      } catch (err) {
        console.error("Approve gagal:", err);
        softToast("Gagal menyetujui: " + (err?.message || "lihat console"));
        return false;
      }
    }

    async function loadSubmissions() {
      if (!sb || !state.authUser) {
        state.submissions = [];
        render();
        return;
      }
      const { data, error } = await sb.from(T.submissions).select("*").order("created_at", { ascending: false });
      if (error) {
        console.warn("Gagal memuat pengajuan tulisan:", error.message);
        return;
      }
      state.submissions = (data || []).map((r) => ({
        ...(r.data || {}),
        id: r.id,
        status: r.status,
        userId: r.user_id,
        createdAt: r.created_at
      }));
      render();
    }

    // --- DATA PUBLIK: AMBIL + REALTIME ---
    let listenersStarted = false;

    async function loadCollection(table, stateKey, seedList) {
      const { data, error } = await sb.from(table).select("*");
      if (error) throw error;
      if (!data || data.length === 0) {
        // Kosong: seed dari data lokal hanya jika admin yang login
        if (isAdmin() && seedList?.length) {
          for (let i = 0; i < seedList.length; i++) {
            const item = seedList[i];
            await cloudUpsert(table, item.id, { ...item, createdAt: item.createdAt || Date.now() - i * 1000 }).catch(() => {});
          }
        }
        return;
      }
      const list = data.map(rowToItem).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      state[stateKey] = list;
      saveBackups();
      render();
    }

    async function loadSettings() {
      const { data, error } = await sb.from(T.settings).select("data").eq("id", "main").maybeSingle();
      if (error) throw error;
      state.cloudSyncStatus = "synced";
      const d = data?.data;
      if (d) {
        if (d.siteConfig) state.siteConfig = { ...state.siteConfig, ...d.siteConfig };
        if (d.boardMembers) state.boardMembers = d.boardMembers;
        if (d.categoryMeta) state.categoryMeta = { ...state.categoryMeta, ...d.categoryMeta };
        if (typeof d.siteVisits === "number") state.siteVisits = d.siteVisits;
        saveBackups();
      }
      render();
    }

    async function startCloudListeners() {
      if (listenersStarted || !sb) return;
      listenersStarted = true;
      try {
        await loadSettings();
        // Hitung +1 kunjungan situs sekali per sesi
        if (!sessionStorage.getItem("st_cloud_visit_counted")) {
          sessionStorage.setItem("st_cloud_visit_counted", "1");
          sb.rpc("increment_site_visits").then(({ data }) => {
            if (typeof data === "number") { state.siteVisits = data; render(); }
          }, () => {});
        }
        await Promise.all([
          loadCollection(T.publications, "publications", state.publications),
          loadCollection(T.events, "events", state.events),
          loadCollection(T.advocacy, "advocacyCases", state.advocacyCases)
        ]);
      } catch (err) {
        console.warn("Supabase tidak tersedia; situs berjalan dengan cadangan lokal.", err);
        state.cloudSyncStatus = "offline";
        render();
        return;
      }

      // Realtime (aktifkan Replication pada tabel di Supabase; jika tidak, data tetap termuat saat halaman dibuka)
      try {
        sb.channel("st-realtime")
          .on("postgres_changes", { event: "*", schema: "public", table: T.settings }, () => loadSettings().catch(() => {}))
          .on("postgres_changes", { event: "*", schema: "public", table: T.publications }, () => loadCollection(T.publications, "publications").catch(() => {}))
          .on("postgres_changes", { event: "*", schema: "public", table: T.events }, () => loadCollection(T.events, "events").catch(() => {}))
          .on("postgres_changes", { event: "*", schema: "public", table: T.advocacy }, () => loadCollection(T.advocacy, "advocacyCases").catch(() => {}))
          .on("postgres_changes", { event: "*", schema: "public", table: T.submissions }, () => loadSubmissions().catch(() => {}))
          .subscribe();
      } catch {}
    }

    // --- INISIALISASI SUPABASE AUTH ---
    if (!sb) {
      state.cloudSyncStatus = "offline";
      console.warn("Supabase belum dikonfigurasi (isi SUPABASE_URL & SUPABASE_ANON_KEY). Situs berjalan dengan cadangan lokal.");
      setTimeout(() => showToast("Mode lokal aktif. Isi SUPABASE_URL & SUPABASE_ANON_KEY di index.html untuk sinkronisasi Cloud."), 500);
    } else {
      sb.auth.onAuthStateChange((_event, session) => {
        // Jangan panggil query Supabase langsung di dalam callback ini (hindari deadlock); tunda dengan setTimeout
        setTimeout(async () => {
          state.authUser = session?.user || null;
          state.currentUser = await resolveCurrentUser(session?.user || null);
          render();
          loadSubmissions().catch(() => {});
          startCloudListeners();
        }, 0);
      });
      sb.auth.getSession().then(({ data }) => {
        // Pastikan data publik termuat meski belum login
        if (!data?.session) startCloudListeners();
      });
    }

        state.isMegaManagerOpen = true;

        state.isMegaManagerOpen = false;
        render();
      } else if (action === "download-mega-package") {
        const manifest = {
          nama_folder_utama: "Arsip_Mega_Socialist_Table",
          dibuat_pada: new Date().toLocaleString("id-ID"),
          struktur_folder: {
            "01_Bidang_Sosial": state.publications.filter((p) => p.category === "sosial"),
            "02_Bidang_Politik": state.publications.filter((p) => p.category === "politik"),
            "03_Bidang_Hukum": state.publications.filter((p) => p.category === "hukum"),
            "04_Bidang_Lingkungan": state.publications.filter((p) => p.category === "lingkungan")
          }
        };
        const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Arsip_Mega_Socialist_Table_${new Date().toISOString().slice(0, 10)}.json`;

    document.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);

      if (form.id === "auth-form") {
        const authErr = (err) => {
          const m = String(err?.message || "").toLowerCase();
          const c = String(err?.code || "").toLowerCase();
          if (m.includes("already registered") || m.includes("already been registered") || c.includes("user_already_exists")) return "Email sudah terdaftar.";
          if (m.includes("password should be at least") || c.includes("weak_password")) return "Kata sandi terlalu lemah (minimal 6 karakter).";
          if (m.includes("invalid email") || m.includes("unable to validate email") || c.includes("email_address_invalid")) return "Format email tidak valid.";
          if (m.includes("rate limit") || c.includes("over_request_rate_limit") || c.includes("over_email_send_rate_limit")) return "Terlalu banyak percobaan. Coba lagi beberapa menit lagi.";
          if (m.includes("email not confirmed") || c.includes("email_not_confirmed")) return "Email belum diverifikasi. Cek kotak masuk email Anda.";
          if (m.includes("signups not allowed") || c.includes("signup_disabled") || c.includes("provider_disabled")) return "Aktifkan Email provider / Sign-ups di Supabase Authentication.";
          if (m.includes("error sending") || m.includes("sending confirmation") || c.includes("unexpected_failure") && m.includes("email")) return "Email konfirmasi gagal dikirim. Periksa pengaturan SMTP / batas email di Supabase, atau matikan 'Confirm email'.";
          if (m.includes("database error saving new user")) return "Database error saat menyimpan user baru. Jalankan ulang supabase-setup.sql (bagian trigger handle_new_user).";
          if (m.includes("failed to fetch") || m.includes("networkerror")) return "Tidak dapat terhubung ke Supabase. Periksa koneksi internet dan SUPABASE_URL.";
          if (state.authTab === "register") return "Pendaftaran gagal: " + (err?.message || "kesalahan tidak diketahui");
          return "Email atau kata sandi tidak sesuai.";
        };
        if (!sb) {
          state.authError = "Supabase belum dikonfigurasi. Isi SUPABASE_URL & SUPABASE_ANON_KEY di index.html.";
          render();
          return;
        }
        if (state.authTab === "login") {
          const email = String(fd.get("identifier") || "").trim();
          const passInput = String(fd.get("password") || "");
          try {
            const { data, error } = await sb.auth.signInWithPassword({ email, password: passInput });
            if (error) throw error;
            const u = data.user;
            state.isAuthModalOpen = false;
            state.authError = "";
            showToast(`Selamat datang kembali, ${u.user_metadata?.name || u.email}!`);
            render();
          } catch (err) {
            state.authError = authErr(err);
            render();
            return;
          }
        } else {
          const name = String(fd.get("name") || "").trim();
          const email = String(fd.get("email") || "").trim().toLowerCase();
          const password = String(fd.get("password") || "");
          if (!name || !email || password.length < 6) {
            state.authError = "Isi nama, email valid, dan sandi minimal 6 karakter.";
            render();
            return;
          }
          try {
            const { data, error } = await sb.auth.signUp({
              email,
              password,
              options: { data: { name } }
            });
            if (error) throw error;
            // Jika "Confirm email" aktif, email yang sudah terdaftar dikembalikan tanpa error tetapi identities kosong
            if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
              throw { message: "User already registered" };
            }
            // Profil member disimpan otomatis oleh trigger di database (lihat supabase-setup.sql).
            // Jika "Confirm email" aktif di Supabase, session kosong sampai email diverifikasi.
            if (data.session && data.user) {
              state.authUser = data.user;
              state.currentUser = { id: data.user.id, name, email, role: "member" };
            }
            state.authError = "";
            state.registrationNotice = { name, email, needsConfirm: !data.session };
          } catch (err) {
            console.error("Supabase signUp error:", err);
            state.authError = authErr(err);
          }
          render();
        }
      } else if (form.id === "hero-editor-form") {
        state.siteConfig.heroTagline = String(fd.get("heroTagline") || "");

        await syncSettingsToCloud({ siteConfig: state.siteConfig }).catch(() => {});

      } else if (form.id === "add-board-form") {
        state.boardMembers.push({
          id: `bm-${Date.now()}`,
          name: String(fd.get("name") || ""),
          role: String(fd.get("role") || ""),
          focus: String(fd.get("focus") || "")
        });
        saveBackups();
        render();
        await syncSettingsToCloud({ boardMembers: state.boardMembers }).catch(() => {});
        showToast("Pengurus baru ditambahkan ke Cloud!");

        state.categoryMeta[state.selectedCategory].desc = String(fd.get("desc") || "");
        state.activeSectionEditor = null;
        saveBackups();
        await syncSettingsToCloud({ categoryMeta: state.categoryMeta }).catch(() => {});
        showToast("Deskripsi bidang diperbarui!");
      } else if (form.id === "advocacy-highlight-form") {
        state.siteConfig.advocacyHighlightTitle = String(fd.get("advocacyHighlightTitle") || "");
        state.siteConfig.advocacyHighlightDesc = String(fd.get("advocacyHighlightDesc") || "");

        await syncSettingsToCloud({ siteConfig: state.siteConfig }).catch(() => {});
        showToast("Sorotan advokasi tersimpan ke Cloud!");
      } else if (form.id === "add-advocacy-form") {
        const newCase = {

      } else if (form.id === "logo-editor-form") {
        if (state.logoDraft.logoType === "url") {
          state.logoDraft.logoImageUrl = String(fd.get("logoImageUrl") || "");
        }

        state.siteConfig = { ...state.siteConfig, ...state.logoDraft };
        state.isLogoEditorOpen = false;
        saveBackups();
        await syncSettingsToCloud({ siteConfig: state.siteConfig }).catch(() => {});
        showToast("Logo Socialist Table berhasil disimpan ke Cloud!");
      } else if (form.id === "edit-submission-form") {
        const d = state.reviewDraft || {};
        const ok = await saveSubmissionEdits(state.editingSubmissionId, {
          title: fd.get("title") ?? d.title,
          excerpt: fd.get("excerpt") ?? d.excerpt,
          content: fd.get("content") ?? d.content
        });
        if (ok) showToast("Perubahan tulisan tersimpan. Anda masih bisa menyetujui atau menolaknya.");
      } else if (form.id === "submit-article-form") {
        if (!sb || !state.authUser) {
          softToast("Silakan masuk terlebih dahulu.");
          return;
        }
        const type = fd.get("type") === "report" ? "report" : "opinion";
        const catRaw = String(fd.get("category") || "sosial");
        const category = state.categoryMeta[catRaw] ? catRaw : "sosial";
        const title = String(fd.get("title") || "").trim();
        const author = String(fd.get("author") || "").trim();
        const excerpt = String(fd.get("excerpt") || "").trim();
        const content = String(fd.get("content") || "").trim();
        const docRaw = String(fd.get("docUrl") || "").trim();
        const docUrl = safeHttpUrl(docRaw);
        if (!title || !author || content.length < 50) {
          softToast("Judul, penulis, dan isi tulisan (minimal 50 karakter) wajib diisi.");
          return;
        }
        if (docRaw && !docUrl) {
          softToast("Tautan lampiran harus diawali http:// atau https://");
          return;
        }
        const pendingMine = state.submissions.filter((x) => x.userId === state.authUser.id && x.status === "pending").length;
        if (pendingMine >= MAX_PENDING_PER_USER) {
          softToast(`Anda masih punya ${MAX_PENDING_PER_USER} pengajuan yang menunggu. Tunggu hasil tinjauan admin dulu.`);
          return;
        }
        const payload = {
          type,
          category,
          title,
          author,
          excerpt,
          content,
          docUrl,
          date: new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" }),
          submitterName: state.currentUser?.name || "",
          submitterEmail: state.authUser.email || ""
        };
        const { error } = await sb.from(T.submissions).insert({
          id: `sub-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          data: payload,
          status: "pending",
          user_id: state.authUser.id,
          created_at: Date.now()
        });
        if (error) {
          console.error("Kirim pengajuan gagal:", error);
          softToast("Gagal mengirim: " + (error.message || "lihat console (F12)"));
          return;
        }
        state.submitDraft = {};
        state.isSubmitModalOpen = false;
        await loadSubmissions();
        showToast("Tulisan terkirim! Admin akan meninjaunya sebelum tayang.");
      } else if (form.id === "upload-pub-form") {
        const category = String(fd.get("category") || "sosial");
        const content = String(fd.get("content") || "");
        const excerpt = String(fd.get("excerpt") || "").trim() || content.slice(0, 150) + "...";
        const newPub = {
          id: `pub-${Date.now()}`,
          type: String(fd.get("type") || "opinion"),
          category,
          title: String(fd.get("title") || ""),
          author: String(fd.get("author") || ""),
          date: String(fd.get("date") || ""),
          excerpt,
          content,
          docUrl: String(fd.get("docUrl") || ""),
          docName: String(fd.get("docUrl") || "").includes("mega.nz") ? "Dokumen_MEGA.pdf" : "Dokumen_Lampiran.pdf",
          coverGradient: (COVER_PRESETS.find((c) => c.id === category) || COVER_PRESETS[0]).gradient,
          customCover: "",
          views: 0,
          createdAt: Date.now()
        };
        state.publications.unshift(newPub);
        state.isUploadModalOpen = false;
        state.selectedCategory = category;
        state.activePage = "fokus";
        saveBackups();
        render();
        await cloudUpsert(T.publications, newPub.id, newPub).catch(() => {});
        showToast("Tulisan/kajian berhasil dipublikasikan ke Cloud!");
      } else if (form.id === "edit-pub-form") {
        const updated = {
          ...state.editingPubItem,
          type: String(fd.get("type") || "opinion"),
          category: String(fd.get("category") || "sosial"),
          title: String(fd.get("title") || ""),
          author: String(fd.get("author") || ""),
          date: String(fd.get("date") || ""),
          excerpt: String(fd.get("excerpt") || ""),
          content: String(fd.get("content") || ""),
          docUrl: String(fd.get("docUrl") || "")
        };
        state.publications = state.publications.map((p) => (p.id === updated.id ? updated : p));
        state.editingPubItem = null;
        saveBackups();
        render();
        await cloudUpsert(T.publications, updated.id, updated).catch(() => {});
        showToast("Perubahan tulisan/kajian tersimpan ke Cloud!");
      } else if (form.id === "mega-links-form") {
        state.siteConfig.megaRootFolderUrl = String(fd.get("megaRootFolderUrl") || "");
        state.siteConfig.megaFolderSosialUrl = String(fd.get("megaFolderSosialUrl") || "");
        state.siteConfig.megaFolderPolitikUrl = String(fd.get("megaFolderPolitikUrl") || "");
        state.siteConfig.megaFolderHukumUrl = String(fd.get("megaFolderHukumUrl") || "");
        state.siteConfig.megaFolderLingkunganUrl = String(fd.get("megaFolderLingkunganUrl") || "");
        state.isMegaManagerOpen = false;
        saveBackups();
        await syncSettingsToCloud({ siteConfig: state.siteConfig }).catch(() => {});
        showToast("Tautan folder MEGA tersimpan ke Cloud!");
      }
    });

    // Render awal saat halaman dibuka
    render();
  </script>
</body>
</html>
